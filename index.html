<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>マイワールド</title>
    
    <!-- セキュリティ強化のためのContent Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; 
        script-src 'self';  <!-- スクリプトを自ドメインと指定 -->
        style-src 'self';  <!-- スタイルシートは自ドメインのみ -->
        img-src 'self';  <!-- 画像の取得元を制限（自ドメインのみ） -->
        font-src 'self';  <!-- フォントの取得元制限 -->
        connect-src 'self';  <!-- 接続の制限 -->
        object-src 'none';  <!-- オブジェクトのロード禁止 -->
        upgrade-insecure-requests;  <!-- HTTPからHTTPSへの強制リダイレクト -->
    ">

    <!-- サイトのセキュリティ強化 -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains; preload">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <style>
        /* 右クリック禁止 */
        body {
            -webkit-user-select: none; /* すべてのブラウザで選択無効 */
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* 画像ドラッグ無効 */
        .character-img {
            pointer-events: none; /* 画像クリック・ドラッグを無効 */
        }

        /* 透明な画像を重ねる */
        .character {
            position: relative;
        }

        .character-img::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.5); /* 半透明のオーバーレイ */
            pointer-events: none; /* 画像クリックを防ぐ */
        }

        /* 長押し防止のために透明なオーバーレイ */
        .character-img-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: transparent;
            pointer-events: all; /* タッチイベントを無効にしない */
        }
    </style>
</head>
<body>
    <header>
        <h1>ようこそ！</h1>
        <p>私の適当なページです！</p>
    </header>

    <div class="main-content">
        <div class="character">
            <!-- 同じディレクトリにある画像を読み込む -->
            <img src="character.png" alt="キャラ" class="character-img">
            <!-- 長押しを防止するための透明なオーバーレイ -->
            <div class="character-img-overlay"></div>
            <p id="characterText" class="character-text">こんにちは！</p>
            <!-- 絵文字ハート -->
            <span id="heartEffect" class="heart">💖</span>
        </div>

        <button id="animationButton">〜〜〜〜くるくる〜〜〜〜</button>
    </div>

    <footer>
        <p>© 2025 マイワールド All rights reserved.</p>
        <div class="footer-links">
            <a href="https://x.com/coara_choco" target="_blank" rel="noopener noreferrer">Xのアカウント</a>
        </div>
    </footer>

    <script>
        // 右クリック禁止
        document.addEventListener('contextmenu', function(event) {
            event.preventDefault(); // 右クリックメニューを無効にする
        });

        // 画像ドラッグ無効
        document.querySelector('.character-img').addEventListener('dragstart', function(event) {
            event.preventDefault(); // 画像をドラッグできないようにする
        });

        // スマホの長押し無効
        document.querySelector('.character-img').addEventListener('touchstart', function(event) {
            event.preventDefault(); // 長押しイベントを無効にする
        });
    </script>
</body>
</html>
