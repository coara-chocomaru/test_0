<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>マイワールド</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f9f6f7;
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #ffb6c1;
            padding: 20px 0;
        }

        h1 {
            font-size: 3em;
            color: #ff69b4;
        }

        .main-content {
            margin: 20px;
        }

        .character {
            display: inline-block;
            margin-top: 20px;
        }

        .character-img {
            width: 150px;
            height: auto;
            border-radius: 50%;
            animation: bounce 1s infinite;
        }

        .character-text {
            font-size: 1.5em;
            margin-top: 10px;
            color: #ff69b4;
        }

        button {
            background-color: #ff69b4;
            color: white;
            padding: 10px 20px;
            font-size: 1.2em;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        button:hover {
            transform: scale(1.1);
        }

        footer {
            background-color: #ffb6c1;
            padding: 10px;
            position: fixed;
            width: 100%;
            bottom: 0;
            text-align: center;
        }

        .footer-links a {
            color: #ff69b4;
            text-decoration: none;
            margin: 0 10px;
            font-size: 1.2em;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>ようこそ！</h1>
        <p>私の適当なページです！</p>
    </header>

    <div class="main-content">
        <div class="character">
            <img src="character.png" alt="かわいいキャラ" class="character-img">
            <p class="character-text">こんにちは！</p>
        </div>

        <button id="animationButton">〜〜〜〜くるくる〜〜〜〜</button>
    </div>

    <footer>
        <p>© 2025 マイワールド All rights reserved.</p>
        <div class="footer-links">
            <a href="https://x.com/coara_choco" target="_blank">Xのアカウント</a>
        </div>
    </footer>
</body>
</html>
