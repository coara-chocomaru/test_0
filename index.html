<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>マイワールド</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>ようこそ！</h1>
        <p>私の適当なページです！</p>
    </header>

    <div class="main-content">
        <div class="character">
            <!-- ローカルのCharacter.pngを読み込む -->
            <img src="Character.png" alt="キャラ" class="character-img">
            <p id="characterText" class="character-text">こんにちは！</p>
            <!-- 絵文字ハート -->
            <span id="heartEffect" class="heart">💖</span>
        </div>

        <button id="animationButton">〜〜〜〜くるくる〜〜〜〜</button>
    </div>

    <footer>
        <p>© 2025 マイワールド All rights reserved.</p>
        <div class="footer-links">
            <a href="https://x.com/coara_choco" target="_blank">Xのアカウント</a>
        </div>
    </footer>
</body>
</html>
