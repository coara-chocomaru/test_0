<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self'; 
        script-src 'self' 'nonce-abc123'; 
        style-src 'self'; 
        img-src 'self'; 
        font-src 'self'; 
        connect-src 'self'; 
        object-src 'none'; 
        frame-ancestors 'self' https://coara-chocomaru.github.io https://coarachocomaru.ct.ws; 
        upgrade-insecure-requests;
    ">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains; preload">
    <meta http-equiv="X-Frame-Options" content="ALLOW-FROM https://coara-chocomaru.github.io">
    
    <title>マイワールド</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <style>
        /* 右クリック禁止 */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .character-img {
            pointer-events: none;
        }

        .character {
            position: relative;
        }

        .character-img::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>ようこそ！</h1>
        <p>私の適当なページです！</p>
    </header>

    <div class="main-content">
        <div class="character">
            <img src="character.png" alt="キャラ" class="character-img">
            <p id="characterText" class="character-text">こんにちは！</p>
            <span id="heartEffect" class="heart">💖</span>
        </div>
        <button id="animationButton">〜〜〜〜くるくる〜〜〜〜</button>
    </div>

    <footer>
        <p>© 2025 マイワールド All rights reserved.</p>
        <div class="footer-links">
            <a href="https://x.com/coara_choco" target="_blank" rel="noopener noreferrer">Xのアカウント</a>
        </div>
    </footer>

    <script nonce="abc123">
        // 右クリック禁止
        document.addEventListener('contextmenu', function(event) {
            event.preventDefault();
        });

        // 画像ドラッグ無効
        document.querySelector('.character-img').addEventListener('dragstart', function(event) {
            event.preventDefault();
        });

        // デベロッパーツール対策 (iframe では実行しない)
        if (window.self === window.top) { 
            (function() {
                var devtools = /./;
                devtools.toString = function() {
                    window.location.href = 'https://www.google.com'; // もし開いたらgoogleに飛ばす
                };
                console.log(devtools);
            })();
        }

        // XSS監視: URLやパラメータに不正な文字列が含まれていないかチェック
        if (window.self === window.top) {
            window.addEventListener('DOMContentLoaded', (event) => {
                const checkXSS = () => {
                    const urlParams = new URLSearchParams(window.location.search);
                    for (let param of urlParams) {
                        const value = param[1];
                        if (/</.test(value) || />/.test(value) || /script/.test(value)) {
                            window.location.href = 'https://www.google.com'; // 不正な文字列を検出した場合
                        }
                    }
                };
                checkXSS();
            });
        }

        // 外部ドメイン監視 (iframe 内では監視を無効化)
        if (window.self === window.top) {
            const originalOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url) {
                if (url && !url.startsWith(window.location.origin)) {
                    window.location.href = 'https://www.google.com'; // 外部ドメインにアクセスしようとした場合
                }
                originalOpen.apply(this, arguments);
            };
        }
    </script>
</body>
</html>
