<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>マイワールド</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f9f6f7;
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #ffb6c1;
            padding: 20px 0;
        }

        h1 {
            font-size: 3em;
            color: #ff69b4;
        }

        .main-content {
            margin: 20px;
        }

        .character {
            display: inline-block;
            margin-top: 20px;
            position: relative;
        }

        .character-img {
            width: 150px;
            height: auto;
            border-radius: 50%;
            animation: bounce 1s infinite;
            transition: transform 0.3s;
        }

        .character-text {
            font-size: 1.5em;
            margin-top: 10px;
            color: #ff69b4;
        }

        .crying {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            animation: crying 2s infinite;
            visibility: hidden;
        }

        button {
            background-color: #ff69b4;
            color: white;
            padding: 10px 20px;
            font-size: 1.2em;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        button:hover {
            transform: scale(1.1);
        }

        footer {
            background-color: #ffb6c1;
            padding: 10px;
            position: fixed;
            width: 100%;
            bottom: 0;
            text-align: center;
        }

        .footer-links a {
            color: #ff69b4;
            text-decoration: none;
            margin: 0 10px;
            font-size: 1.2em;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes crying {
            0%, 100% {
                top: 30px;
            }
            50% {
                top: 35px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>ようこそ！</h1>
        <p>私の適当なページです！</p>
    </header>

    <div class="main-content">
        <div class="character">
            <img src="character.png" alt="かわいいキャラ" class="character-img">
            <p id="characterText" class="character-text">こんにちは！</p>
            <img src="crying.png" alt="涙" class="crying" id="cryingImage">
        </div>

        <button id="animationButton">〜〜〜〜くるくる〜〜〜〜</button>
    </div>

    <footer>
        <p>© 2025 マイワールド All rights reserved.</p>
        <div class="footer-links">
            <a href="https://x.com/coara_choco" target="_blank">Xのアカウント</a>
        </div>
    </footer>

    <script>
        const characterText = document.getElementById("characterText");
        const cryingImage = document.getElementById("cryingImage");
        const animationButton = document.getElementById("animationButton");
        let isSpinning = false;
        let spinCount = 0;

        // 時間帯ごとにセリフを変更
        function updateGreeting() {
            const hour = new Date().getHours();
            if (hour < 12) {
                characterText.textContent = "おはよう！";
            } else if (hour < 18) {
                characterText.textContent = "こんにちは！";
            } else {
                characterText.textContent = "こんばんは！";
            }
        }

        // ボタンがクリックされた時の処理
        animationButton.addEventListener("click", function() {
            if (!isSpinning) {
                isSpinning = true;
                spinCount++;
                cryingImage.style.visibility = "hidden"; // 涙を非表示
                characterText.textContent = "くるくる回ってるよ〜！";
                document.querySelector('.character-img').style.animation = 'bounce 1s infinite';

                // 10秒後に停止
                setTimeout(() => {
                    document.querySelector('.character-img').style.animation = 'none';
                    characterText.textContent = "終わったよ！";
                    isSpinning = false;

                    // 何回も回したら涙を表示
                    if (spinCount > 3) {
                        cryingImage.style.visibility = "visible";
                        characterText.textContent = "あれ…何回も回っちゃった…";
                    }
                }, 10000);
            }
        });

        // 初回読み込み時に時間帯ごとのセリフを表示
        updateGreeting();
    </script>
</body>
</html>
